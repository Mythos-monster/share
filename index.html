  { emoji:"🐌", name:"급전개 방지용 노트 명령어", cat:"system", tags:"급전개 속도 페이스 천천히 개연성",
    links:[{label:"열기",url:"https://notes.io/ebGpk"}],
    desc:`스토리가 너무 빠르게 진행되거나, 갑자기 고백/전투/이별 같은 큰 이벤트가 튀어나오는 게 싫을 때 쓸 수 있는 유저/제작자 범용 300자짜리 명령어입니다.

AI가 매 턴 전개 속도를 스스로 점검하면서 감정선과 사건을 천천히 쌓아갑니다.

• 관계 진전은 단계적으로만 허용됩니다.
• 큰 사건 전에 반드시 복선과 전조가 선행됩니다.
• 유저가 직접 선택하지 않은 급격한 전환이 차단됩니다.` },

  { emoji:"🪞", name:"NPC 일관성 리마인드", cat:"system", tags:"일관성 보정 말투 성격 리마인드 붕괴",
    links:[{label:"열기",url:"https://notes.io/e3xJm"}],
    desc:`장기 RP나 다수의 캐릭터가 등장하는 시뮬레이션에서, NPC의 말투·성격·행동 패턴이 점차 흐려지거나 다른 캐릭터와 섞일 때 사용합니다.
명령어를 입력하면 대상 캐릭터를 즉시 재보정하고, 직전 턴을 수정하여 다시 출력합니다.

◆ 추천 상황
• NPC의 말투가 처음과 달라졌다고 느껴질 때

• NPC가 절대 하지 않을 행동이나 발언을 했을 때

◆ 비추천 상황
• 캐릭터가 의도적으로 변화하는 중인 경우 (성장, 각성, 감정 변화 등)
• 아직 캐릭터의 성격이 확립되기 전인 초반부

◆ 작동 방식
• 명령어를 입력하면 현재 RP가 일시 중단됩니다.
• 유저가 입력한 복원 태그(말투, 성격, 습관 등)와 원문 샘플을 기준으로 대상 캐릭터를 재보정합니다.
• 직전 턴에서 해당 캐릭터의 어긋난 부분을 수정한 뒤, 처음부터 다시 출력합니다.

◆ 유의사항

• 컨텍스트가 길어진 상태에서는 효과가 점차 약해질 수 있습니다. 필요할 때마다 다시 사용해 주세요.

◆ 사용법

• 원문 샘플은 선택사항입니다. 없으면 해당 칸을 삭제해도 됩니다.` },

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#2C2A44;--muted:#6F6B8C;--faint:#A8A4C0;
    --lav:#B7A6E8;--lav-deep:#8E7BD6;--blue:#6E86E4;
    --silver:#CFD5E6;--silver-soft:#EBEDF6;--glass:rgba(255,255,255,.72);
    --shadow:0 6px 22px rgba(110,134,228,.10),0 1px 2px rgba(44,42,68,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(120% 80% at 88% -8%, rgba(183,166,232,.42) 0%, rgba(183,166,232,0) 45%),
      radial-gradient(110% 70% at 6% 4%, rgba(110,134,228,.28) 0%, rgba(110,134,228,0) 42%),
      linear-gradient(168deg,#ECE7F9 0%, #EAF0FC 46%, #F5F4FC 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 72px;}
  header{padding:46px 4px 20px;}
  h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:35px;letter-spacing:-0.01em;margin:0;line-height:1.2;
    background:linear-gradient(96deg,var(--lav-deep),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
  h1 .star{font-size:22px;-webkit-text-fill-color:var(--lav);margin-right:8px;vertical-align:2px;}
  .sub{color:var(--muted);font-size:15px;margin-top:8px;font-family:"Gowun Batang",serif;}

  .searchbar{position:sticky;top:0;z-index:20;padding:10px 0 16px;background:linear-gradient(#EEEAFA 68%,rgba(238,234,250,0));}
  .field{position:relative;}
  .field input{width:100%;font-size:16px;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--silver);border-radius:16px;padding:15px 44px 15px 46px;outline:none;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;}
  .field input:focus{border-color:var(--lav-deep);box-shadow:0 0 0 3px rgba(142,123,214,.15),var(--shadow);}
  .field input::placeholder{color:var(--faint);}
  .field .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--lav-deep);pointer-events:none;}
  .field .clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--faint);width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;}
  .field .clear.show{display:flex;}
  .count{font-size:13px;color:var(--faint);padding:0 6px 12px;}

  .acc{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--silver);border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .acc.hidden{display:none;}
  .acc-head{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:none;cursor:pointer;text-align:left;padding:16px;color:var(--ink);font-size:16px;font-weight:600;}
  .cat-ico{width:34px;height:34px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(150deg,#EEE7FB,#E4ECFB);border:1px solid var(--silver-soft);}
  .cat-name{flex:1;}
  .cat-count{font-size:12px;font-weight:600;color:var(--lav-deep);background:#EFEAFA;border:1px solid #E3DAF6;border-radius:999px;padding:2px 9px;min-width:26px;text-align:center;}
  .chev-cat{color:var(--faint);flex:0 0 auto;transition:transform .28s ease;}
  .acc.open .chev-cat{transform:rotate(90deg);}
  .acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;}
  .acc.open>.acc-body{grid-template-rows:1fr;}
  .acc-inner{overflow:hidden;}
  .acc ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--silver-soft);}

  li.item{border-top:1px solid var(--silver-soft);}
  li.item:first-child{border-top:none;}
  li.item.hidden{display:none;}
  .item-head{width:100%;display:flex;align-items:flex-start;gap:12px;background:transparent;border:none;text-align:left;cursor:pointer;color:inherit;padding:14px 16px;}
  .item-head:active{background:rgba(238,234,250,.6);}
  .ico{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;margin-top:1px;background:linear-gradient(150deg,#F1ECFC,#E9EFFC);}
  .nm{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.4;padding-top:5px;}
  .nm .badge{font-size:11px;color:var(--blue);border:1px solid #D5DEFA;background:#EEF2FE;border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px;font-weight:600;}
  .chev{color:var(--faint);flex:0 0 auto;margin-top:9px;transition:transform .26s ease;}
  .item.open .chev{transform:rotate(90deg);}

  .item-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .item.open>.item-body{grid-template-rows:1fr;}
  .item-inner{overflow:hidden;}
  .ds{white-space:pre-wrap;font-size:13.5px;color:#514E6B;line-height:1.72;padding:2px 18px 2px 60px;}
  .links{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px 18px 60px;}
  .go{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,var(--lav-deep),var(--blue));border-radius:10px;padding:8px 13px;box-shadow:0 3px 8px rgba(110,134,228,.28);}
  .go:active{transform:scale(.97);}
  .go.alt{color:var(--lav-deep);background:#fff;border:1px solid var(--silver);box-shadow:none;}
  mark{background:linear-gradient(transparent 55%,#E4DBF8 55%);color:inherit;padding:0 1px;}

  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:15px;}
  footer{text-align:center;color:var(--faint);font-size:14px;padding-top:26px;letter-spacing:.5em;}
  @media (prefers-reduced-motion:reduce){.acc-body,.item-body,.chev,.chev-cat{transition:none;}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="star">✦</span><span id="ttl"></span></h1>
      <div class="sub" id="sub"></div>
    </header>
    <div class="searchbar">
      <div class="field">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="검색…" autocomplete="off" autocapitalize="off" enterkeyhint="search">
        <button class="clear" id="clear" aria-label="지우기">×</button>
      </div>
    </div>
    <div class="count" id="count"></div>
    <div id="sections"></div>
    <div class="empty" id="empty" style="display:none">일치하는 명령어가 없어요</div>
    <footer>✦ ✦ ✦</footer>
  </div>

<script>
  document.getElementById('ttl').textContent=PAGE.title;
  const subEl=document.getElementById('sub');
  if(PAGE.subtitle){subEl.textContent=PAGE.subtitle;}else{subEl.style.display='none';}
  document.title=PAGE.title;

  const wrapEl=document.getElementById('sections'),countEl=document.getElementById('count'),
        emptyEl=document.getElementById('empty'),qEl=document.getElementById('q'),clearEl=document.getElementById('clear');

  function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function hl(t,q){t=t||'';if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t);
    return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}
  const chevC='<svg class="chev-cat" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  const chevI='<svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

  const sections=[];
  CATS.forEach((cat,idx)=>{
    const items=LINKS.filter(l=>l.cat===cat.id);
    if(!items.length)return;
    const sec=document.createElement('section');
    sec.className='acc';
    sec.innerHTML=`<button class="acc-head" type="button"><span class="cat-ico">${esc(cat.icon)}</span><span class="cat-name">${esc(cat.label)}</span><span class="cat-count"></span>${chevC}</button><div class="acc-body"><div class="acc-inner"><ul></ul></div></div>`;
    const ul=sec.querySelector('ul'), countPill=sec.querySelector('.cat-count');
    sec.userOpen=false;
    sec.querySelector('.acc-head').addEventListener('click',()=>{ if(searching)return; sec.userOpen=!sec.userOpen; sec.classList.toggle('open',sec.userOpen); });

    const itemRefs=items.map(l=>{
      const li=document.createElement('li'); li.className='item';
      const badge=l.internal?' <span class="badge">이 페이지</span>':'';
      const linksHtml=(l.links||[]).map((k,i)=>{
        const tgt=k.internal?'':' target="_blank" rel="noopener"';
        const arrow=k.internal?' ›':' ↗';
        return `<a class="go${i>0?' alt':''}" href="${k.url}"${tgt}>${esc(k.label)}${arrow}</a>`;
      }).join('');
      li.innerHTML=`<button class="item-head" type="button"><span class="ico">${esc(l.emoji||'·')}</span><span class="nm">${esc(l.name)}${badge}</span>${chevI}</button>
        <div class="item-body"><div class="item-inner"><div class="ds"></div><div class="links">${linksHtml}</div></div></div>`;
      const dsEl=li.querySelector('.ds'); dsEl.textContent=l.desc||'';
      li.querySelector('.item-head').addEventListener('click',()=>{ li.classList.toggle('open'); });
      ul.appendChild(li);
      return {l,li,dsEl,nmEl:li.querySelector('.nm'),badge};
    });
    wrapEl.appendChild(sec);
    sections.push({cat,sec,countPill,items:itemRefs});
  });

  let searching=false;
  function render(q){
    q=(q||'').trim().toLowerCase(); searching=!!q; let total=0;
    sections.forEach(s=>{
      let vis=0;
      s.items.forEach(it=>{
        const hay=(it.l.name+' '+(it.l.desc||'')+' '+(it.l.tags||'')).toLowerCase();
        const m=!q||hay.includes(q);
        it.li.classList.toggle('hidden',!m);
        if(m)vis++;
        it.nmEl.innerHTML=hl(it.l.name,q)+it.badge;
        it.dsEl.innerHTML=q?hl(it.l.desc||'',q):esc(it.l.desc||'');
        it.li.classList.toggle('open', searching && m);
      });
      total+=vis;
      s.countPill.textContent=searching?vis:s.items.length;
      s.sec.classList.toggle('hidden',searching&&vis===0);
      if(searching){s.sec.classList.add('open');}
      else{s.sec.classList.toggle('open',s.sec.userOpen);}
    });
    countEl.textContent=searching?`${total}개 결과`:`명령어 ${LINKS.length}개 · ${sections.length}개 분류`;
    emptyEl.style.display=(searching&&total===0)?'block':'none';
  }
  qEl.addEventListener('input',e=>{clearEl.classList.toggle('show',!!e.target.value);render(e.target.value);});
  clearEl.addEventListener('click',()=>{qEl.value='';clearEl.classList.remove('show');render('');qEl.focus();});
  render('');
</script>
</body>
</html>
